[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
Output=matos-ralambo.raw
CompressOutput=zst
ImageId=matos
ImageVersion=0.6

[Host]
QemuHeadless=yes
Bootloader=auto
Mirrors=http://deb.debian.org/debian
ExtraRepositories=http://mxrepo.com/mx/repo/ trixie main

[Content]
Hostname=matos
RootPassword=matos
Locale=fr_FR.UTF-8
Keymap=fr
Timezone=Indian/Antananarivo

ExtraTrees=mkosi.extra/
PostInstallationScripts=mkosi.postinst

Packages=
    linux-image-amd64
    systemd
    systemd-sysv
    systemd-boot-efi
    dbus
    sudo
    openssh-server
    # Bureau XFCE4
    xfce4
    xfce4-goodies
    xfce4-terminal
    xfce4-taskmanager
    xfce4-clipman-plugin
    xfce4-whiskermenu-plugin
    xfce4-notifyd
    # Gestionnaire d'affichage
    lightdm
    lightdm-gtk-greeter
    lightdm-gtk-greeter-settings
    # Réseau
    network-manager
    network-manager-gnome
    # Applications de base
    firefox
    thunar
    thunar-archive-plugin
    thunar-media-tags-plugin
    mousepad
    featherpad
    file-roller
    # Audio (PipeWire — standard Trixie)
    pipewire
    pipewire-pulse
    wireplumber
    pavucontrol
    # Firmware
    firmware-linux
    firmware-linux-nonfree
    amd64-microcode
    intel-microcode
    # Bluetooth
    blueman
    bluetooth
    # Système live
    live-boot
    live-boot-initramfs-tools
    live-config
    live-config-systemd
    live-tools
    # Installateur
    calamares
    calamares-settings-debian
    # Utilitaires
    conky-all
    flatpak
    gparted
    htop
    plymouth
    plymouth-themes
    os-prober
    curl
    wget
    git
    # Polices
    fonts-liberation
    fonts-dejavu
    fonts-noto
    fonts-noto-color-emoji

PackageDirectories=mkosi.packages
