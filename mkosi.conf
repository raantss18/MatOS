    xfce4-terminal
    xfce4-taskmanager
    xfce4-clipman-plugin
    xfce4-whiskermenu-plugin
    xfce4-notifyd
    # ── Gestionnaire d'affichage ──────────────────────────────────────
    lightdm
    lightdm-gtk-greeter
    lightdm-gtk-greeter-settings
    # ── Réseau ────────────────────────────────────────────────────────
    network-manager
    network-manager-gnome
    # ── Applications de base ─────────────────────────────────────────
    firefox
    thunar
    thunar-archive-plugin
