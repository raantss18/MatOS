[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
Output=matos-ralambo.raw
CompressOutput=zst
ImageId=matos
ImageVersion=0.6

[Build]
WithNetwork=yes

[Content]
Hostname=matos
RootPassword=matos
Locale=fr_FR.UTF-8
Keymap=fr
Timezone=Indian/Antananarivo
Bootloader=grub
Bootable=yes

ExtraTrees=mkosi.extra/
PostInstallationScripts=mkosi.postinst

