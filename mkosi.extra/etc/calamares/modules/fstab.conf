# Configuration fstab pour matOS RALAMBO
# Génère /etc/fstab dans le système installé

mountOptions:
  default:        defaults
  btrfs:          defaults,compress=zstd:1,noatime

ssdExtraMountOptions:
  ext4:           discard
  btrfs:          discard=async

efiMountOptions: "umask=0077"

luksGenName: "luks-"
