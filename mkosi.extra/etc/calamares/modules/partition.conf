# Configuration du module de partitionnement pour matOS RALAMBO
# Basé sur Debian Trixie avec GRUB (BIOS et UEFI)

efiSystemPartition:       "/boot/efi"
efiSystemPartitionSize:   "300M"
efiSystemPartitionName:   "EFI System Partition"

defaultFileSystemType:    "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs", "f2fs" ]

enableLuksAutomatedPartitioning: true

userSwapChoices:
  - none
  - small
  - suspend
  - file

# Taille minimale recommandée : 15 Go
requiredStorage: 15.0
