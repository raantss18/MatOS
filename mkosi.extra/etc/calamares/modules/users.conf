defaultGroups:
  - name: lpadmin
    system: true
  - name: sudo
    system: true
  - name: audio
    system: true
  - name: video
    system: true
  - name: plugdev
    system: true
  - name: netdev
    system: true
  - name: bluetooth
    system: true

userShell:       /bin/bash

autologinGroup:  autologin
doAutologin:     false

setRootPassword: true
doReusePassword: false

passwordRequirements:
  minLength:          8
  maxLength:          -1
  libpwquality:
    - minlen=8

forbiddenLoginNames:
  - root

userCreation: default
