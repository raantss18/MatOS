#MX-welcome configuration — matOS RALAMBO
#Copié dans /etc/mx-welcome/ pour override le fichier /usr/share/mx-welcome/mx-welcome.conf

DISTRO=matOS
HEADER=/usr/share/mx-welcome/header.png
LOGO=/usr/share/MatOS/logos/logo-blue.svg

CODENAME=RALAMBO

SUPPORTED="Juin 2029"

SHOWLIVEUSERINFO=""
LIVEUSERINFOTEXT=""

TOSTEXT=""
TOSCMD=""

CHECKLSB_RELEASE=""

1icon=/usr/share/mx-welcome/icons/setup.png
1text="Installer matOS"
1command="pkexec calamares"
2icon=/usr/share/mx-welcome/icons/faq.png
2text="FAQ"
2command="mx-faq"
3icon=/usr/share/mx-welcome/icons/tools.png
3text="Outils matOS"
3command="mx-tools"
4icon=/usr/share/mx-welcome/icons/users-manual.png
4text="Manuel"
4command="mx-manual"
5icon=/usr/share/mx-welcome/icons/tour.png
5text="Visite guidée"
5command="mx-tour --title 'Visite de matOS'"
6icon=/usr/share/MatOS/logos/logo-blue.svg
6text="À propos"
6command="mx-welcome --about --title 'À propos de matOS RALAMBO'"
