<?xml version="1.0" encoding="UTF-8"?>
<!-- matOS : écran du chargeur d'amorçage de l'ISO (isolinux et GRUB).
     live-build remplace les marqueurs @...@ puis le convertit en PNG. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="480" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1a0d2e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#fond)"/>
  <rect x="0" y="472" width="640" height="8" fill="#00c9a7"/>
  <image x="220" y="24" width="200" height="141" xlink:href="data:image/png;base64,"/>
  <text x="320" y="199" text-anchor="middle" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#f0f4f8">matOS RALAMBO</text>
  <text x="320" y="223" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#a9b8c8">Distribution pour les mathématiques — basée sur Debian 13</text>
  <text x="320" y="462" text-anchor="middle" font-family="DejaVu Sans" font-size="10" fill="#6c7f93">linux @LINUX_VERSIONS@ · construit le @YEAR@-@MONTH@-@DAY@</text>
</svg>
