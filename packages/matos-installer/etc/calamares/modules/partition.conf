# matOS : « Effacer le disque » présélectionné (le cas le plus courant ; le résumé et la
# confirmation restent affichés avant toute écriture). Pas de partition d'échange par
# défaut : matOS utilise un swap compressé en mémoire (zram), qui n'use pas le disque.
efiSystemPartition: "/boot/efi"
userSwapChoices:
    - none
    - small
    - file
initialPartitioningChoice: erase
initialSwapChoice: none
defaultFileSystemType: "ext4"
