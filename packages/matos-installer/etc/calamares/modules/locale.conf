# matOS : sans réseau, la géolocalisation échoue et Calamares proposait « New York »
# (et des dates en anglais américain). Fuseau par défaut : Madagascar, modifiable dans l'assistant.
region: "Indian"
zone:   "Antananarivo"
# Format des nombres et des dates : voir scripts/build-debs.sh (lanceur calamares-install-debian)
# et /usr/share/matos/installateur/locales. Le réglage « localeGenPath » ne suffit pas :
# Calamares lit d'abord /usr/share/i18n/SUPPORTED.
