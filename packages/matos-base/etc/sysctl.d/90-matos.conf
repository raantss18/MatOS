# matOS : machine de bureau, souvent avec peu de RAM (zram activé)
vm.swappiness=100
vm.vfs_cache_pressure=50
kernel.nmi_watchdog=0
# Avec zram, lire/écrire une page à la fois (pas de lecture anticipée du swap)
vm.page-cluster=0
# Réclamer la mémoire plus tôt et plus régulièrement : évite les à-coups quand le swap
# compressé se remplit (réglages recommandés par le noyau pour zram)
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125
