# matOS : earlyoom évite le gel total quand la mémoire (4 Go) est saturée :
# il termine le plus gros consommateur avant que le système ne s'effondre.
# Le bureau est protégé ; navigateurs, éditeurs Electron et GeoGebra sont visés d'abord.
# (Drop-in : le fichier /etc/default/earlyoom du paquet Debian n'est pas touché.)
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 4 -s 4 --avoid '(^|/)(Xorg|xfce4-session|xfwm4|xfdesktop|xfce4-panel|lightdm|systemd|dbus-daemon|NetworkManager)$' --prefer '(^|/)(Web Content|firefox-esr|codium|rstudio|rsession|GeoGebra|soffice[.]bin|java|jupyter-lab|sage-ipython)$'
