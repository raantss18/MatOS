# Extras de SageMath : paquets conda retirés de l'image pour l'alléger, et
# réinstallables à l'identique (même version, même build) avec :
#     sudo matos-sage-extras installer NOM
# Source unique : lue par scripts/relock-sagemath.sh, scripts/build-debs.sh
# et matos-sage-extras.
#
# format : nom | description | paquets conda retirés (séparés par des espaces)
# L'extra « python » est calculé par relock-sagemath.sh : paquets qui ne sont
# pas dans le cœur (voir PYTHON_EXTRAS dans ce script).
compilateurs|Compilateurs C, C++ et Fortran de conda (inutiles : le gcc de Debian est installé)|gcc gcc_linux-64 gcc_impl_linux-64 gxx gxx_linux-64 gxx_impl_linux-64 gfortran_impl_linux-64 binutils_impl_linux-64 binutils_linux-64 conda-gcc-specs sysroot_linux-64 kernel-headers_linux-64 libstdcxx-devel_linux-64 libgcc-devel_linux-64 libsanitizer
java-3d|Java et Jmol : affichage 3D de Sage en mode terminal (Jupyter utilise threejs, sans Java)|openjdk jmol
pandoc|Pandoc : exports de carnets Jupyter vers LaTeX, PDF, Word|pandoc
giac|Moteur Giac pour Sage (Xcas, qui l'utilise déjà, est installé depuis Debian)|giac
