name: matOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      iso:
        description: "Construire une ISO de test (sans SageMath ni Lean)"
        type: boolean
        default: false

jobs:
  verifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe des scripts
        run: |
          for f in build.sh scripts/*.sh packages/*/DEBIAN/p* packages/*/usr/bin/* \
                   live/config/hooks/normal/*.hook.chroot; do
            bash -n "$f" && echo "ok $f"
          done

      - name: XML des réglages XFCE
        run: |
          sudo apt-get install -y -qq libxml2-utils
          find packages -name '*.xml' -print0 | xargs -0 xmllint --noout

      - name: Empreintes de versions.env
        run: |
          . ./versions.env
          for v in MICROMAMBA_SHA256 ELAN_SHA256 GEOGEBRA_SHA256 VSCODIUM_SHA256 \
                   RSTUDIO_SHA256 BIBATA_SHA256; do
            [[ "${!v}" =~ ^[0-9a-f]{64}$ ]] || { echo "SHA256 invalide : $v"; exit 1; }
          done

      - name: Paquets légers (dans debian:trixie)
        run: |
          docker run --rm -v "$PWD:/matos" -e MATOS_ROOT=/matos debian:trixie bash -c '
            apt-get update -qq &&
            apt-get install -y -qq --no-install-recommends ca-certificates curl unzip dpkg-dev xz-utils zstd >/dev/null &&
            /matos/scripts/build-debs.sh matos-base matos-desktop matos-math matos-installer \
                matos-bibliotheque matos-geogebra matos-vscodium-config &&
            for d in /matos/build/debs/*.deb; do dpkg-deb -I "$d" >/dev/null && echo "ok $d"; done'

  iso-rapide:
    if: github.event_name == 'workflow_dispatch' && inputs.iso
    needs: verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Construire l'ISO de test
        run: ./build.sh --rapide

      - name: Publier l'ISO de test
        uses: actions/upload-artifact@v4
        with:
          name: matos-iso-rapide-${{ github.run_number }}
          path: out/
          retention-days: 3
